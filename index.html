<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI 整備マニュアル検索.O</title>
    <script src="https://cloud.google.com/ai/gen-app-builder/client?hl=ja"></script>
    
    <style>
        :root { --primary-color: #1a73e8; --bg-color: #f5f7f9; }
        body { font-family: sans-serif; margin: 0; background-color: var(--bg-color); display: flex; flex-direction: column; height: 100vh; }
        header { background-color: var(--primary-color); color: white; padding: 15px; text-align: center; }
        #chat-container { flex: 1; padding: 20px; overflow-y: auto; }
        .welcome-msg { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid var(--primary-color); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* 入力エリア */
        .input-area { background: white; padding: 20px; border-top: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px 20px; border: 1px solid #ccc; border-radius: 25px; font-size: 16px; outline: none; }
        .send-btn { background: var(--primary-color); color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        
        /* ウィジェット表示エリア：高さをしっかり確保 */
        #widget-target { min-height: 500px; width: 100%; margin-top: 10px; }
        
        /* reCAPTCHAバッジを邪魔にならない位置へ */
        .grecaptcha-badge { bottom: 100px !important; }
    </style>
</head>
<body>

<header><h1>🔧 kubota WSM AI 整備マニュアル検索.O</h1></header>

<div id="chat-container">
    <div class="welcome-msg">AIガイドです。質問を入力して検索ボタンを押してください。</div>
    
    <div id="widget-target">
        <gen-search-widget
            id="myWidget"
            configId="ea87f861-8662-4a50-b0b4-598d12387543"
            location="global"
            displayMode="inline">
        </gen-search-widget>
    </div>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="例：ボンネットの開け方を教えて">
    <button id="searchBtn" class="send-btn">検索</button>
</div>

<script>
    const widgetEl = document.getElementById('myWidget');
    const inputEl = document.getElementById('userInput');
    const searchBtn = document.getElementById('searchBtn');

    async function performSearch() {
        const query = inputEl.value.trim();
        if (!query) return;

        searchBtn.disabled = true;
        searchBtn.innerText = "探索中...";

        // エラー（reCAPTCHA Timeout等）を回避するためのリトライ機能
        let success = false;
        for (let i = 0; i < 3; i++) {
            if (widgetEl && typeof widgetEl.search === 'function') {
                try {
                    await widgetEl.search(query);
                    inputEl.value = '';
                    success = true;
                    break; 
                } catch (err) {
                    console.error(`Attempt ${i+1} failed:`, err);
                    await new Promise(r => setTimeout(r, 1000)); // 1秒待って再試行
                }
            } else {
                await new Promise(r => setTimeout(r, 1000));
            }
        }

        if (!success) {
            alert("AIの応答が遅れています。もう一度ボタンを押すか、ページを更新してください。");
        }

        searchBtn.disabled = false;
        searchBtn.innerText = "検索";
    }

    searchBtn.addEventListener('click', performSearch);
    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });
</script>
</body>
</html>
