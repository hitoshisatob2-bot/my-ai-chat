<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI ガイド.d</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; background-color: #7494c0; overflow: hidden; }
        
        /* チャットエリア */
        #main-content { flex: 1; display: flex; flex-direction: column; transition: 0.3s; }
        header { background: #273246; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        /* 吹き出し */
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; line-height: 1.6; font-size: 14px; position: relative; }
        .ai-container { display: flex; flex-direction: column; align-items: flex-start; }
        .ai-bubble { background: white; color: #333; border-top-left-radius: 2px; }
        .user-bubble { background: #85e249; align-self: flex-end; border-top-right-radius: 2px; }

        /* 目玉アイコンボタン */
        .view-icon {
            cursor: pointer; background: white; border: 1px solid #1a73e8; color: #1a73e8;
            padding: 4px 10px; border-radius: 20px; font-size: 12px; margin-top: 8px;
            display: flex; align-items: center; gap: 5px; transition: 0.2s;
        }
        .view-icon:hover { background: #1a73e8; color: white; }

        /* サイドパネル */
        #side-panel { width: 0; transition: 0.3s; background: #333; position: relative; display: flex; flex-direction: column; }
        #side-panel.open { width: 50%; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        .close-btn { position: absolute; left: -40px; top: 10px; width: 40px; height: 40px; background: #273246; color: white; border: none; cursor: pointer; border-radius: 5px 0 0 5px; }

        /* 入力エリア */
        .input-bar { background: white; padding: 15px; display: flex; gap: 10px; }
        #user-input { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 25px; outline: none; }
        #send-btn { background: #1a73e8; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
        .loading { color: white; font-size: 12px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div id="main-content">
    <header>kubota WSM AI ガイド.d</header>
    <div id="chat-history">
        <div class="ai-container">
            <div class="msg ai-bubble">こんにちは！クボタ整備マニュアルAIです。知りたい手順を詳しくお教えします。</div>
        </div>
    </div>
    <div id="loading-text" class="loading" style="text-align: center;">AIがマニュアルを読み取っています...</div>
    <div class="input-bar">
        <input type="text" id="user-input" placeholder="例：ボンネットの開け方は？">
        <button id="send-btn" onclick="handleSend()">▲</button>
    </div>
</div>

<div id="side-panel">
    <button class="close-btn" onclick="togglePanel(false)">✕</button>
    <iframe id="pdf-viewer"></iframe>
</div>

<script>
    const CLOUD_RUN_URL = "https://vertex-search-proxy-242714184617.asia-northeast1.run.app/query";

    function appendMessage(text, isUser, pdfUrl = null) {
        const history = document.getElementById('chat-history');
        const container = document.createElement('div');
        container.className = isUser ? "msg user-bubble" : "ai-container";

        if (isUser) {
            container.innerText = text;
        } else {
            const bubble = document.createElement('div');
            bubble.className = "msg ai-bubble";
            // 改行と太字の処理
            bubble.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            container.appendChild(bubble);

            if (pdfUrl) {
                const btn = document.createElement('button');
                btn.className = "view-icon";
                btn.innerHTML = "👁️ 根拠となるページを確認";
                btn.onclick = () => {
                    document.getElementById('pdf-viewer').src = pdfUrl;
                    togglePanel(true);
                };
                container.appendChild(btn);
            }
        }
        history.appendChild(container);
        history.scrollTop = history.scrollHeight;
    }

    async function handleSend() {
        const input = document.getElementById('user-input');
        const loading = document.getElementById('loading-text');
        const query = input.value.trim();
        if (!query) return;

        appendMessage(query, true);
        input.value = "";
        loading.style.display = "block";

        try {
            const res = await fetch(CLOUD_RUN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query }) // ここは「純粋な質問」のみ送る
            });
            const data = await res.json();

            let answer = data.summary?.summaryText || "申し訳ありません。マニュアル内に該当する手順が見つかりませんでした。";
            let pdfUrl = null;

            if (data.results?.length > 0) {
                let link = data.results[0].document.derivedStructData.link || data.results[0].document.derivedStructData.formattedUrl;
                // gs:// を https:// に置換
                if (link && link.startsWith('gs://')) {
                    pdfUrl = link.replace('gs://', 'https://storage.googleapis.com/');
                } else {
                    pdfUrl = link;
                }
            }
            appendMessage(answer, false, pdfUrl);
        } catch (e) {
            appendMessage("エラーが発生しました。接続を確認してください。", false);
        } finally {
            loading.style.display = "none";
        }
    }

    function togglePanel(open) {
        document.getElementById('side-panel').className = open ? "open" : "";
    }

    document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
</script>
</body>
</html>
