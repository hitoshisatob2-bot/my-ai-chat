<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI ガイド.d</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #f0f2f5;
        }
        /* チャットエリア */
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
            background-color: #7188ad;
        }
        #header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 14px;
            position: relative;
        }
        .user-message {
            align-self: flex-end;
            background-color: #4cd964;
            color: black;
        }
        .ai-message {
            align-self: flex-start;
            background-color: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .citation {
            color: #007bff;
            text-decoration: underline;
            cursor: pointer;
            margin-left: 4px;
            font-weight: bold;
        }
        #input-area {
            padding: 20px;
            background-color: white;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
        /* PDFビューアエリア */
        #pdf-container {
            flex: 1;
            background-color: #525659;
            display: flex;
            flex-direction: column;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">kubota WSM AI ガイド.d</div>
    <div id="messages">
        <div class="message ai-message">こんにちは！クボタの整備士です。機種名や故障・点検の手順を教えてください。</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="例：SL280のボンネットの開け方は？" onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">送信</button>
    </div>
</div>

<div id="pdf-container">
    <iframe id="pdf-viewer" src="about:blank"></iframe>
</div>

<script>
    async function sendMessage() {
        const inputElement = document.getElementById('user-input');
        const messageContainer = document.getElementById('messages');
        const query = inputElement.value.trim();
        if (!query) return;

        // ユーザーメッセージを表示
        appendMessage(query, 'user-message');
        inputElement.value = '';

        try {
            // Cloud Runのプロキシサーバーへリクエスト
            // URLはご自身の vertex-search-proxy のものに書き換えてください
            const response = await fetch('https://vertex-search-proxy-242714184617.asia-northeast1.run.app/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });

            const data = await response.json();
            
            if (data.answer) {
                // AIの回答を整形して表示
                processAiResponse(data);
            } else {
                appendMessage('回答を取得できませんでした。', 'ai-message');
            }
        } catch (error) {
            console.error('Error:', error);
            appendMessage('エラーが発生しました。', 'ai-message');
        }
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerHTML = text;
        document.getElementById('messages').appendChild(msgDiv);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function processAiResponse(data) {
        let formattedAnswer = data.answer;

        // 引用 [1], [2] をクリック可能なリンクに置換する処理
        formattedAnswer = formattedAnswer.replace(/\[(\d+)\]/g, (match, number) => {
            const index = parseInt(number) - 1;
            const result = data.results && data.results[index];

            if (result && result.document && result.document.derivedStructData) {
                const struct = result.document.derivedStructData;
                
                // PDFの基本URL取得
                let url = struct.link || struct.formattedUrl;
                if (url.startsWith('gs://')) {
                    url = url.replace('gs://', 'https://storage.googleapis.com/');
                }

                // ページ番号を抽出 (extractive_segments から取得)
                let pageNum = 1;
                if (struct.extractive_segments && struct.extractive_segments[0]) {
                    pageNum = struct.extractive_segments[0].pageNumber || 1;
                }

                // 特定ページを開くためのアンカー付加
                const finalUrl = `${url}#page=${pageNum}`;

                return `<span class="citation" onclick="openPdf('${finalUrl}')">[${number}]</span>`;
            }
            return match;
        });

        // 改行をHTML用に置換
        formattedAnswer = formattedAnswer.replace(/\n/g, '<br>');
        appendMessage(formattedAnswer, 'ai-message');
    }

    function openPdf(url) {
        document.getElementById('pdf-viewer').src = url;
    }
</script>

</body>
</html>
