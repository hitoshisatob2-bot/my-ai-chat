<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI ガイド.c</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: "Hiragino Kaku Gothic ProN", Arial, sans-serif; overflow: hidden; background-color: #f0f2f5; }
        #chat-container { width: 45%; display: flex; flex-direction: column; background-color: #7494c0; border-right: 2px solid #ccc; }
        header { background: #273246; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        /* 吹き出しと装飾 */
        .msg { max-width: 90%; padding: 15px; border-radius: 15px; line-height: 1.7; font-size: 14px; background: white; color: #333; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .user-bubble { background: #85e249; align-self: flex-end; border-top-right-radius: 2px; }
        .ai-container { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
        
        /* 引用（[1]など）をリンク化 */
        .citation { color: #1a73e8; font-weight: bold; cursor: pointer; text-decoration: underline; margin: 0 2px; }
        .citation:hover { color: #d32f2f; }

        /* 機種名などの太字を赤く目立たせる（公式風） */
        b, strong { color: #d32f2f; font-weight: bold; }

        .input-bar { background: white; padding: 15px; display: flex; gap: 10px; }
        #user-input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        #send-btn { background: #1a73e8; color: white; border: none; width: 45px; border-radius: 50%; cursor: pointer; }

        #pdf-container { width: 55%; background: #525659; display: flex; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
    </style>
</head>
<body>

<div id="chat-container">
    <header>kubota WSM AI ガイド.c</header>
    <div id="chat-history">
        <div class="msg">こんにちは！クボタの整備士AIです。機種名や故障・点検の手順を教えてください。</div>
    </div>
    <div class="input-bar">
        <input type="text" id="user-input" placeholder="例：SL280のボンネットの開け方は？">
        <button id="send-btn" onclick="handleSend()">▲</button>
    </div>
</div>

<div id="pdf-container">
    <iframe id="pdf-viewer" src=""></iframe>
</div>

<script>
    const CLOUD_RUN_URL = "https://vertex-search-proxy-242714184617.asia-northeast1.run.app/query";

    // PDFを表示する関数
    function openPdf(url, page) {
        const viewer = document.getElementById('pdf-viewer');
        viewer.src = `${url}#page=${page}`;
    }

    async function handleSend() {
        const input = document.getElementById('user-input');
        const history = document.getElementById('chat-history');
        const query = input.value.trim();
        if (!query) return;

        // ユーザーの質問を表示
        const userMsg = document.createElement('div');
        userMsg.className = "msg user-bubble";
        userMsg.innerText = query;
        history.appendChild(userMsg);
        input.value = "";

        try {
            const res = await fetch(CLOUD_RUN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });
            const data = await res.json();

            const aiContainer = document.createElement('div');
            aiContainer.className = "ai-container";
            const aiBubble = document.createElement('div');
            aiBubble.className = "msg";

            let answerText = data.summary?.summaryText || "回答が見つかりませんでした。";
            
            // 1. 太字の変換
            answerText = answerText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // 2. 改行の変換
            answerText = answerText.replace(/\n/g, '<br>');

            // 3. 引用 [1], [2] をクリック可能なリンクに変換
            answerText = answerText.replace(/\[(\d+)\]/g, (match, number) => {
                const index = parseInt(number) - 1;
                const result = data.results[index];
                if (result) {
                    const doc = result.document.derivedStructData;
                    let url = doc.link || doc.formattedUrl;
                    if (url.startsWith('gs://')) url = url.replace('gs://', 'https://storage.googleapis.com/');
                    const page = doc.extractive_segments?.[0]?.pageNumber || 1;
                    
                    return `<span class="citation" onclick="openPdf('${url}', ${page})">[${number}]</span>`;
                }
                return match;
            });

            aiBubble.innerHTML = answerText;
            aiContainer.appendChild(aiBubble);
            history.appendChild(aiContainer);
            history.scrollTop = history.scrollHeight;

            // 最初の引用箇所を自動で右側に表示
            const firstResult = data.results[0]?.document.derivedStructData;
            if (firstResult) {
                let url = firstResult.link || firstResult.formattedUrl;
                if (url.startsWith('gs://')) url = url.replace('gs://', 'https://storage.googleapis.com/');
                openPdf(url, firstResult.extractive_segments?.[0]?.pageNumber || 1);
            }

        } catch (e) {
            console.error(e);
        }
    }
</script>
</body>
</html>
