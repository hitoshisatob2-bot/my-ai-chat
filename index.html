<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI 整備マニュアル検索.L</title>
    <script src="https://cloud.google.com/ai/gen-app-builder/client?hl=ja"></script>
    
    <style>
        :root { --primary-color: #1a73e8; --bg-color: #f5f7f9; }
        body { font-family: sans-serif; margin: 0; background-color: var(--bg-color); display: flex; flex-direction: column; height: 100vh; }
        header { background-color: var(--primary-color); color: white; padding: 15px; text-align: center; }

        #chat-interface { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #chat-container { flex: 1; padding: 20px; overflow-y: auto; }
        
        .welcome-msg { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid var(--primary-color); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* 入力エリア：常に操作可能に */
        .input-area { background: white; padding: 20px; border-top: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px 20px; border: 1px solid #ccc; border-radius: 25px; font-size: 16px; outline: none; background: white !important; }
        .send-btn { background: var(--primary-color); color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; }

        /* reCAPTCHA位置 */
        .grecaptcha-badge { bottom: 85px !important; }

        /* ウィジェットエリア：あえて標準の検索窓を出してみるテスト */
        #widget-wrapper { min-height: 600px; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

<header><h1>🔧 kubota WSM AI 整備マニュアル検索.L</h1></header>

<div id="chat-interface">
    <div id="chat-container">
        <div class="welcome-msg">AIガイドです。質問を入力して「検索」を押してください。</div>
        
        <div id="widget-wrapper">
            <gen-search-widget
                id="myWidget"
                configId="ea87f861-8662-4a50-b0b4-598d12387543"
                location="global"
                displayMode="inline">
            </gen-search-widget>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="ここに質問を入力...">
        <button id="searchBtn" class="send-btn">検索</button>
    </div>
</div>

<script>
    const widgetEl = document.getElementById('myWidget');
    const inputEl = document.getElementById('userInput');
    const searchBtn = document.getElementById('searchBtn');

    // 検索実行関数
    async function performSearch() {
        const query = inputEl.value.trim();
        if (!query) return;

        console.log("検索開始:", query);
        
        // ボタンを一時的に「送信中」にするが、入力欄はロックしない
        searchBtn.innerText = "送信中";
        searchBtn.disabled = true;

        try {
            // ウィジェットの存在チェック
            if (widgetEl && typeof widgetEl.search === 'function') {
                await widgetEl.search(query);
                inputEl.value = '';
                console.log("ウィジェットへの送信成功");
            } else {
                console.error("ウィジェットのsearch関数が見つかりません。");
                alert("AIの準備ができていません。ページ上部に出現する検索窓に直接入力してみてください。");
            }
        } catch (err) {
            console.error("検索エラー:", err);
        } finally {
            searchBtn.innerText = "検索";
            searchBtn.disabled = false;
        }
    }

    searchBtn.addEventListener('click', performSearch);
    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });
</script>
</body>
</html>
