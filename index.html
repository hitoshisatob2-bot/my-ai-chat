<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>kubota WSM AI.b</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      background: #f0f4f8;
    }

    /* ===== スタート画面 ===== */
    #start-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #e8f0fe 0%, #f0f8ff 50%, #f8f9ff 100%);
      z-index: 99999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }
    .start-logo {
      font-size: 2.6rem; font-weight: 800; color: #1a73e8;
      letter-spacing: -0.5px;
    }
    .start-icon { font-size: 3.5rem; margin-bottom: 4px; }
    .start-subtitle { color: #555; font-size: 1.1rem; font-weight: 500; }
    .start-btn {
      margin-top: 20px; padding: 16px 56px;
      font-size: 1.05rem; font-weight: 700;
      background: linear-gradient(135deg, #1a73e8, #0d62d0);
      color: #fff; border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 6px 20px rgba(26,115,232,0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(26,115,232,0.55);
    }
    .start-btn:active { transform: translateY(0); }
    .start-note { font-size: 0.82rem; color: #999; margin-top: 6px; }
    .start-features {
      display: flex; gap: 20px; margin-top: 10px;
    }
    .start-feature {
      background: white; border-radius: 12px;
      padding: 10px 18px; font-size: 0.85rem;
      color: #444; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex; align-items: center; gap: 6px;
    }

    /* ===== メインレイアウト ===== */
    .chat-container {
      flex: 1; display: flex; flex-direction: column;
      background: #fff; min-width: 0; overflow: hidden;
    }

    /* ===== ヘッダー ===== */
    .chat-header {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 20px;
      background: linear-gradient(90deg, #1a73e8, #1557b0);
      color: #fff; font-size: 1rem; font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18); z-index: 10;
      flex-shrink: 0;
    }
    .header-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #34a853; box-shadow: 0 0 6px #34a853;
      animation: blink 2s infinite;
    }
    @keyframes blink {
      0%,100%{opacity:1} 50%{opacity:0.3}
    }

    /* ===== メッセージエリア ===== */
    .messages-area {
      flex: 1; overflow-y: auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 14px;
      background: #f7f8fc;
    }
    .messages-area::-webkit-scrollbar { width: 6px; }
    .messages-area::-webkit-scrollbar-thumb {
      background: #d0d4e0; border-radius: 3px;
    }

    .message {
      display: flex; gap: 10px;
      animation: fadeUp 0.3s ease forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0; font-weight: bold;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .message.user  .msg-avatar { background: #1a73e8; color: #fff; }
    .message.ai    .msg-avatar { background: #fff; color: #1a73e8; border: 2px solid #e8f0fe; }
    .message.error .msg-avatar { background: #fce8e6; color: #c5221f; }

    .msg-bubble {
      max-width: 72%; padding: 11px 15px;
      border-radius: 20px; font-size: 0.93rem; line-height: 1.6;
      word-break: break-word;
    }
    .message.user  .msg-bubble {
      background: linear-gradient(135deg, #1a73e8, #1557b0);
      color: #fff; border-bottom-right-radius: 5px;
    }
    .message.ai    .msg-bubble {
      background: #fff; color: #202124;
      border-bottom-left-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.09);
    }
    .message.error .msg-bubble {
      background: #fce8e6; color: #b31412;
      border: 1px solid #f4b5b2; border-bottom-left-radius: 5px;
      font-size: 0.88rem;
    }

    /* 参照リンク */
    .msg-refs {
      margin-top: 8px; padding-top: 8px;
      border-top: 1px solid #e8f0fe;
      font-size: 0.8rem; color: #555;
    }
    .msg-refs-title { color: #888; margin-bottom: 4px; }
    .msg-ref-link {
      display: inline-flex; align-items: center; gap: 4px;
      background: #e8f0fe; color: #1a73e8;
      padding: 3px 10px; border-radius: 12px; margin: 2px 2px 2px 0;
      text-decoration: none; font-size: 0.78rem; cursor: pointer;
      transition: background 0.15s;
    }
    .msg-ref-link:hover { background: #d2e3fc; }

    /* タイピングアニメーション */
    .typing-dots {
      display: flex; gap: 5px; align-items: center;
      padding: 6px 4px;
    }
    .typing-dots span {
      width: 8px; height: 8px; background: #bdc1c6;
      border-radius: 50%; animation: dots 1.3s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dots {
      0%,80%,100%{ transform:scale(0.7); opacity:0.4; }
      40%{ transform:scale(1); opacity:1; }
    }

    /* ===== ウェルカムメッセージ ===== */
    .welcome-block {
      text-align: center; padding: 48px 20px 20px;
      color: #aaa;
    }
    .welcome-block .w-icon { font-size: 3.5rem; margin-bottom: 10px; }
    .welcome-block h3 { color: #666; margin: 0 0 8px; font-size: 1.1rem; }
    .welcome-block p { font-size: 0.88rem; line-height: 1.6; margin: 0; }
    .suggestion-chips {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 18px;
    }
    .chip {
      background: #e8f0fe; color: #1a73e8;
      padding: 7px 16px; border-radius: 20px;
      font-size: 0.82rem; cursor: pointer; border: none;
      transition: background 0.15s, transform 0.1s;
    }
    .chip:hover { background: #d2e3fc; transform: translateY(-1px); }

    /* ===== 音声ステータス ===== */
    .voice-bar {
      min-height: 26px; display: flex; align-items: center;
      justify-content: center; gap: 8px;
      font-size: 0.8rem; color: #ea4335;
      padding: 0 16px 2px;
      background: white;
    }
    .voice-wave {
      display: none; gap: 2px; align-items: center;
    }
    .voice-wave.active { display: flex; }
    .voice-wave span {
      width: 3px; border-radius: 2px; background: #ea4335;
      animation: wave 0.8s infinite ease-in-out;
    }
    .voice-wave span:nth-child(1){ height:8px; }
    .voice-wave span:nth-child(2){ height:14px; animation-delay:0.1s; }
    .voice-wave span:nth-child(3){ height:10px; animation-delay:0.2s; }
    .voice-wave span:nth-child(4){ height:16px; animation-delay:0.3s; }
    .voice-wave span:nth-child(5){ height:8px;  animation-delay:0.15s; }
    @keyframes wave {
      0%,100%{ transform:scaleY(0.5); opacity:0.5; }
      50%{ transform:scaleY(1); opacity:1; }
    }

    /* ===== 入力エリア ===== */
    .input-area {
      padding: 10px 14px 12px;
      background: white;
      border-top: 1px solid #e8eaed;
      display: flex; gap: 8px; align-items: flex-end;
      flex-shrink: 0;
    }
    .input-wrap {
      flex: 1; position: relative;
    }
    #inputField {
      width: 100%; border: 2px solid #e0e0e0; border-radius: 24px;
      padding: 10px 18px; font-size: 0.93rem;
      font-family: inherit; outline: none; resize: none;
      min-height: 44px; max-height: 130px;
      line-height: 1.5; transition: border-color 0.2s;
      overflow-y: auto;
    }
    #inputField:focus { border-color: #1a73e8; }
    #inputField::placeholder { color: #bbb; }

    .btn-icon {
      width: 44px; height: 44px; border-radius: 50%;
      border: none; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; transition: background 0.15s, transform 0.1s;
    }
    .btn-icon:active { transform: scale(0.92); }

    #voiceBtn { background: #f1f3f4; color: #5f6368; }
    #voiceBtn:hover { background: #e8eaed; }
    #voiceBtn.recording {
      background: #ea4335; color: white;
      animation: pulse 1.1s infinite;
    }
    @keyframes pulse {
      0%,100%{ box-shadow: 0 0 0 0 rgba(234,67,53,0.45); }
      60%{ box-shadow: 0 0 0 10px rgba(234,67,53,0); }
    }

    #sendBtn {
      background: linear-gradient(135deg, #1a73e8, #1557b0);
      color: white;
    }
    #sendBtn:hover { filter: brightness(1.1); }
    #sendBtn:disabled { background: #d0d4dc; cursor: not-allowed; filter: none; }

    /* ===== PDFパネル ===== */
    .pdf-panel {
      width: 0; border-left: 2px solid #ddd;
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
      background: #525659; overflow: hidden;
      flex-shrink: 0; position: relative;
    }
    body.pdf-open .pdf-panel { width: 50vw; }
    .pdf-close-btn {
      position: absolute; top: 10px; right: 10px; z-index: 20;
      background: rgba(0,0,0,0.4); border: none; color: #fff;
      width: 30px; height: 30px; border-radius: 50%;
      cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .pdf-close-btn:hover { background: rgba(0,0,0,0.6); }
    .pdf-panel iframe { width: 100%; height: 100%; border: none; }

    /* レスポンシブ */
    @media (max-width: 600px) {
      body.pdf-open .pdf-panel { width: 100vw; position: fixed; inset: 0; z-index: 50; }
      .msg-bubble { max-width: 85%; }
    }
  </style>
</head>

<body>

<div id="start-screen">
  <div class="start-icon">🔧</div>
  <div class="start-logo">kubota WSM AI</div>
  <div class="start-subtitle">整備マニュアル AIアシスタント</div>
  <div class="start-features">
    <div class="start-feature">📝 テキスト入力</div>
    <div class="start-feature">🎤 音声入力</div>
    <div class="start-feature">🔊 音声読み上げ</div>
  </div>
  <button class="start-btn" onclick="startApp()">AIアシスタントを起動する</button>
  <div class="start-note">登録済みPDFドキュメントから自動検索・回答します</div>
</div>

<div class="chat-container">
  <div class="chat-header">
    <div class="header-dot"></div>
    <span>🔧 kubota WSM AI &nbsp;整備マニュアル検索</span>
  </div>

  <div class="messages-area" id="messagesArea">
    <div class="welcome-block" id="welcomeBlock">
      <div class="w-icon">🤖</div>
      <h3>kubota WSM AI へようこそ</h3>
      <p>整備マニュアルについてご質問ください<br>テキストまたは音声で入力できます</p>
      <div class="suggestion-chips">
        <button class="chip" onclick="insertChip(this)">ボンネットの開け方</button>
        <button class="chip" onclick="insertChip(this)">エンジンオイルの交換方法</button>
        <button class="chip" onclick="insertChip(this)">エアフィルターの清掃</button>
        <button class="chip" onclick="insertChip(this)">冷却水の補充</button>
      </div>
    </div>
  </div>

  <div class="voice-bar" id="voiceBar">
    <div class="voice-wave" id="voiceWave">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <span id="voiceStatusText"></span>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea
        id="inputField"
        placeholder="質問を入力… (Enter で送信 / Shift+Enter で改行)"
        rows="1"
      ></textarea>
    </div>
    <button class="btn-icon" id="voiceBtn" title="音声入力" onclick="toggleVoice()">🎤</button>
    <button class="btn-icon" id="sendBtn" title="送信" onclick="sendMessage()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<aside class="pdf-panel" id="pdfPanel">
  <button class="pdf-close-btn" onclick="closePdf()" title="閉じる">✕</button>
  <iframe id="pdfFrame" title="Document Viewer"></iframe>
</aside>

<script src="https://cloud.google.com/ai/gen-app-builder/client?hl=ja"></script>

<script>
// ================================================================
//  設定 – スクリーンショットから取得した正確な値を反映
// ================================================================
const CFG = {
  projectId : "project-c482c56a-16d2-4b8c-b89", 
  location  : "global",
  configId  : "ea87f861-8662-4a50-b0b4-598d12387543" // コンソールに表示されていたconfigId
};

// ================================================================
//  Vertex AI Widget API連携
// ================================================================

// 1. Widget要素を動的に作成（バックグラウンドで処理するため）
const widgetEl = document.createElement('gen-search-widget');
widgetEl.setAttribute('configId', CFG.configId);
widgetEl.setAttribute('location', CFG.location);
// 実際には表示させず、APIとして利用
widgetEl.style.display = 'none';
document.body.appendChild(widgetEl);

// ================================================================
//  状態変数
// ================================================================
let isBusy       = false;
let recognition  = null;
let isRecording  = false;
let ttsOn        = true;

// ================================================================
//  アプリ起動
// ================================================================
function startApp() {
  document.getElementById('start-screen').style.display = 'none';
  setupVoiceInput();
  document.getElementById('inputField').focus();
  console.log('✅ App started with ConfigID:', CFG.configId);
}

// ================================================================
//  メッセージ送信（Google Cloud Widget API経由）
// ================================================================
async function sendMessage() {
  const field = document.getElementById('inputField');
  const q     = field.value.trim();
  if (!q || isBusy) return;

  removeWelcome();
  appendMsg('user', q);
  field.value = '';
  resizeField(field);

  const tid = showTyping();
  isBusy = true;
  document.getElementById('sendBtn').disabled = true;

  try {
    // Widgetの内部APIを使用して検索を実行
    const response = await widgetEl.search(q);
    removeTyping(tid);

    if (response && response.answer) {
      const answerText = response.answer.answerText;
      const references = response.answer.references || [];
      
      const refs = references.map(ref => ({
        title: ref.unstructuredDocumentInfo?.title || '参照ドキュメント',
        uri: ref.unstructuredDocumentInfo?.uri || ''
      }));

      appendMsg('ai', answerText, refs);
      if (ttsOn) speakText(answerText);
    } else {
      appendMsg('ai', '申し訳ありませんが、資料の中に該当する情報が見つかりませんでした。');
    }
  } catch (err) {
    removeTyping(tid);
    console.error('API error:', err);
    appendMsg('error', `⚠️ エラーが発生しました。認証設定やドメイン制限を確認してください。`);
  } finally {
    isBusy = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

// ================================================================
//  チャット UI ヘルパー
// ================================================================
function removeWelcome() {
  const el = document.getElementById('welcomeBlock');
  if (el) el.remove();
}

function insertChip(btn) {
  const field = document.getElementById('inputField');
  field.value = btn.textContent;
  resizeField(field);
  field.focus();
  sendMessage();
}

function appendMsg(type, text, refs = []) {
  const area    = document.getElementById('messagesArea');
  const wrapper = document.createElement('div');
  wrapper.className = `message ${type}`;

  const avatarMap = { user:'👤', ai:'🤖', error:'⚠️' };

  let refsHtml = '';
  if (refs.length) {
    const links = refs.map(r => 
      r.uri 
        ? `<a class="msg-ref-link" href="${r.uri}" data-uri="${r.uri}" onclick="openPdf(event,this)">📄 ${escHtml(r.title)}</a>`
        : `<span class="msg-ref-link">📄 ${escHtml(r.title)}</span>`
    ).join('');
    refsHtml = `<div class="msg-refs"><div class="msg-refs-title">📚 参照ドキュメント</div>${links}</div>`;
  }

  wrapper.innerHTML = `
    <div class="msg-avatar">${avatarMap[type] || '🤖'}</div>
    <div class="msg-bubble">
      ${escHtml(text).replace(/\n/g,'<br>')}
      ${refsHtml}
    </div>`;

  area.appendChild(wrapper);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('messagesArea');
  const id   = 'typing-' + Date.now();
  const div  = document.createElement('div');
  div.id     = id;
  div.className = 'message ai';
  div.innerHTML  = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-bubble">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return id;
}

function removeTyping(id) {
  document.getElementById(id)?.remove();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ================================================================
//  音声入力
// ================================================================
function setupVoiceInput() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('voiceBtn').style.display = 'none';
    return;
  }
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('voiceBtn').classList.add('recording');
    document.getElementById('voiceWave').classList.add('active');
    setVoiceStatus('🎤 録音中… 話しかけてください');
  };

  recognition.onresult = e => {
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
    }
    if(final) {
      document.getElementById('inputField').value = final;
      resizeField(document.getElementById('inputField'));
    }
  };

  recognition.onend = () => {
    isRecording = false;
    document.getElementById('voiceBtn').classList.remove('recording');
    document.getElementById('voiceWave').classList.remove('active');
    setVoiceStatus('');
    if (document.getElementById('inputField').value.trim()) sendMessage();
  };
}

function toggleVoice() {
  if (!recognition) return;
  if (isRecording) { recognition.stop(); } 
  else { window.speechSynthesis?.cancel(); recognition.start(); }
}

function setVoiceStatus(msg) {
  document.getElementById('voiceStatusText').textContent = msg;
}

// ================================================================
//  音声読み上げ
// ================================================================
function speakText(text) {
  if (!window.speechSynthesis) return;
  const clean = text.replace(/\[.*?\]/g,'').substring(0, 300);
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'ja-JP';
  speechSynthesis.speak(utter);
}

function resizeField(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 130) + 'px';
}

document.addEventListener('DOMContentLoaded', () => {
  const f = document.getElementById('inputField');
  f.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
});

// ================================================================
//  PDFパネル制御
// ================================================================
function openPdf(e, a) {
  e.preventDefault();
  const uri = a.dataset.uri;
  if (!uri) return;
  // Google Cloud StorageのURLをプレビュー可能にするためiframeにセット
  document.getElementById('pdfFrame').src = uri;
  document.body.classList.add('pdf-open');
}

function closePdf() {
  document.body.classList.remove('pdf-open');
  document.getElementById('pdfFrame').src = '';
}
</script>
</body>
</html>
