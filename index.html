<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>kubota WSM AI - Stable</title>
  <link rel="stylesheet" href="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/themes/chat-messenger-default.css">
  <script src="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/chat-messenger.js"></script>
  <style>
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; }
    #messenger { flex: 1; --chat-messenger-height: 100%; }
    /* PDFパネル等のスタイルは動作確認後に戻すため、一旦シンプルにします */
  </style>
</head>
<body>

  <chat-messenger id="messenger" url-allowlist="*">
    <chat-messenger-container 
      chat-title="kubota WSM AI" 
      enable-audio-input="true">
    </chat-messenger-container>
  </chat-messenger>

  <script>
    window.addEventListener("chat-messenger-loaded", () => {
      chatSdk.registerContext(
        chatSdk.prebuilts.ces.createContext({
          // あなたの最新IDを正確に反映
          deploymentName: "projects/project-c482c56a-16d2-4b8c-b89/locations/us/apps/0bccbf8c-d3a5-4ef7-b1df-5e8347673d4b/deployments/6a959a03-8b5b-423b-8ce3-f2eaa269d618",
          tokenBroker: {
            enableTokenBroker: true,
            enableRecaptcha: false, // エラー回避のため必須
          },
        }),
      );
    });
  </script>
</body>
</html>
