<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI 整備ガイド.b</title>
    <style>
        body { 
            margin: 0; background-color: #7494c0; 
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
            display: flex; height: 100vh; overflow: hidden;
        }
        /* メインチャットエリア */
        .chat-container {
            flex: 1; display: flex; flex-direction: column; transition: 0.3s;
        }
        header { 
            background-color: #273246; color: white; padding: 12px; 
            text-align: center; font-weight: bold;
        }
        #chat-history {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 15px;
        }
        /* 吹き出し */
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 15px; line-height: 1.5; }
        .ai-msg-container { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
        .ai-bubble-wrapper { display: flex; align-items: flex-start; gap: 8px; }
        .ai-icon { width: 35px; height: 35px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ai-bubble { background-color: white; color: black; border-top-left-radius: 2px; }
        .user-bubble { background-color: #85e249; color: black; align-self: flex-end; border-top-right-radius: 2px; }

        /* 目玉アイコンボタン */
        .view-btn {
            margin-left: 45px; background: none; border: 1px solid #fff; color: white;
            cursor: pointer; border-radius: 50%; width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center; font-size: 16px;
        }

        /* サイドパネル（PDF表示） */
        #side-panel {
            width: 0; background: #333; transition: 0.3s;
            display: flex; flex-direction: column; position: relative;
        }
        #side-panel.open { width: 50%; } /* 画面の半分をPDFに */
        iframe { width: 100%; height: 100%; border: none; background: white; }
        .close-panel {
            position: absolute; left: -30px; top: 10px; background: #333;
            color: white; border: none; padding: 5px 10px; cursor: pointer;
        }

        /* 入力バー */
        .input-bar { background: white; padding: 10px; display: flex; gap: 8px; }
        #user-input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 15px; }
        #send-btn { background: #1a73e8; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; }
        .loading { color: white; font-size: 12px; margin-left: 45px; display: none; }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>kubota WSM AI ガイド.b</header>
        <div id="chat-history">
            <div class="ai-msg-container">
                <div class="ai-bubble-wrapper">
                    <div class="ai-icon">🚜</div>
                    <div class="msg ai-bubble">こんにちは！機種ごとの整備手順をお教えします。</div>
                </div>
            </div>
        </div>
        <div id="loading" class="loading">AI回答中...</div>
        <div class="input-bar">
            <input type="text" id="user-input" placeholder="メッセージを入力">
            <button id="send-btn" onclick="handleSend()">▲</button>
        </div>
    </div>

    <div id="side-panel">
        <button class="close-panel" onclick="closePDF()">×</button>
        <iframe id="pdf-viewer"></iframe>
    </div>

    <script>
        const CLOUD_RUN_URL = "https://vertex-search-proxy-242714184617.asia-northeast1.run.app/query"; 

        function appendMessage(text, isUser, pdfUrl = null) {
            const history = document.getElementById('chat-history');
            if (isUser) {
                const div = document.createElement('div');
                div.className = "msg user-bubble";
                div.innerText = text;
                history.appendChild(div);
            } else {
                const container = document.createElement('div');
                container.className = "ai-msg-container";
                const formattedText = text.replace(/\n/g, '<br>');
                let html = `
                    <div class="ai-bubble-wrapper">
                        <div class="ai-icon">🚜</div>
                        <div class="msg ai-bubble">${formattedText}</div>
                    </div>`;
                if (pdfUrl) {
                    html += `<button class="view-btn" onclick="openPDF('${pdfUrl}')">👁️</button>`;
                }
                container.innerHTML = html;
                history.appendChild(container);
            }
            history.scrollTop = history.scrollHeight;
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const question = input.value.trim();
            if (!question) return;

            appendMessage(question, true);
            input.value = "";
            document.getElementById('loading').style.display = "block";

            try {
                // 機種ごとの回答を促す指示
                const instruction = question + "（複数の機種が含まれる場合は必ず機種名ごとに分けて手順を説明してください。手順は1.2.3.とステップ形式で詳しく書いてください）";

                const res = await fetch(CLOUD_RUN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: instruction })
                });
                const data = await res.json();

                let answer = data.summary?.summaryText || "回答が見つかりませんでした。";
                let pdfUrl = null;

                if (data.results?.length > 0) {
                    let link = data.results[0].document.derivedStructData.link;
                    // gs:// パスを https://storage.googleapis.com/ に変換
                    if (link && link.startsWith('gs://')) {
                        pdfUrl = link.replace('gs://', 'https://storage.googleapis.com/');
                    } else {
                        pdfUrl = link;
                    }
                }

                appendMessage(answer, false, pdfUrl);
            } catch (e) {
                appendMessage("通信エラーが発生しました。", false);
            } finally {
                document.getElementById('loading').style.display = "none";
            }
        }

        function openPDF(url) {
            document.getElementById('pdf-viewer').src = url;
            document.getElementById('side-panel').classList.add('open');
        }

        function closePDF() {
            document.getElementById('side-panel').classList.remove('open');
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
    </script>
</body>
</html>
