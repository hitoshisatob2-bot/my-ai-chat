<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI 整備マニュアル検索.N</title>
    <script src="https://cloud.google.com/ai/gen-app-builder/client?hl=ja"></script>
    
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background-color: #f5f7f9; }
        header { background-color: #1a73e8; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .instruction { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        /* ウィジェットが表示されるエリア */
        #search-widget-container { min-height: 600px; background: white; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>

<header><h1>🔧 kubota WSM AI 整備マニュアル検索.N</h1></header>

<div class="instruction">
    <p><strong>【動作確認手順】</strong></p>
    <ol>
        <li>下のエリアに「ここで検索」というリンク、または検索窓が表示されるのを待ってください。</li>
        <li>表示されたら、そこをクリックして直接質問を入力してください。</li>
    </ol>
</div>

<div id="search-widget-container">
    <gen-search-widget
        configId="ea87f861-8662-4a50-b0b4-598d12387543"
        location="global">
    </gen-search-widget>
</div>

</body>
</html>
