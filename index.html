<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI 整備マニュアル検索.P</title>
    
    <script src="https://cloud.google.com/ai/gen-app-builder/client?hl=ja"></script>
    
    <style>
        body { font-family: sans-serif; padding: 50px; text-align: center; background-color: #f5f7f9; }
        h1 { color: #1a73e8; }
        
        /* 検索窓（トリガー）の見た目だけ整えます */
        #searchWidgetTrigger {
            padding: 15px 20px;
            font-size: 18px;
            width: 80%;
            max-width: 600px;
            border: 2px solid #1a73e8;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>🔧 kubota WSM AI 整備マニュアル検索.P</h1>
    <p>下の検索窓を<strong>クリック</strong>して、AIを起動してください。</p>

    <gen-search-widget
        configId="ea87f861-8662-4a50-b0b4-598d12387543"
        triggerId="searchWidgetTrigger">
    </gen-search-widget>

    <input placeholder="ここで検索（クリックすると画面が開きます）" id="searchWidgetTrigger" readonly />

</body>
</html>
