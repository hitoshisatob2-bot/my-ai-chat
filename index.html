<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>kubota WSM AI - Fixed</title>
  
  <link rel="stylesheet" href="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/themes/chat-messenger-default.css">
  <script src="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/chat-messenger.js"></script>
  
  <style>
    :root { --panel-w: min(48vw, 800px); }
    body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; overflow: hidden; }
    .chat-container { flex: 1; position: relative; display: flex; flex-direction: column; }
    chat-messenger { flex: 1; }
    
    /* PDFパネル */
    .pdf-panel { width: 0; border-left: 1px solid #ddd; transition: 0.3s; background: #fff; overflow: hidden; }
    body.pdf-open .pdf-panel { width: var(--panel-w); }
    iframe { width: 100%; height: 100%; border: none; }
    
    /* 読み上げ停止ボタン */
    #speech-stop { position: fixed; bottom: 80px; right: 20px; z-index: 9999; display: none; }
    .stop-btn { padding: 8px 16px; background: #333; color: #fff; border-radius: 20px; border: none; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>

  <div class="chat-container">
    <chat-messenger 
      id="messenger" 
      url-allowlist="*"
      deployment-name="projects/project-c482c56a-16d2-4b8c-b89/locations/us/apps/0bccbf8c-d3a5-4ef7-b1df-5e8347673d4b/deployments/6a959a03-8b5b-423b-8ce3-f2eaa269d618">
      <chat-messenger-container 
        chat-title="kubota WSM AI"
        enable-audio-input="true">
      </chat-messenger-container>
    </chat-messenger>
    
    <div id="speech-stop"><button class="stop-btn" onclick="window.speechSynthesis.cancel()">読み上げ停止 ■</button></div>
  </div>

  <aside class="pdf-panel">
    <iframe id="pdfFrame"></iframe>
  </aside>

  <script>
    // 1. SDKの初期化（二重登録で確実性を高める）
    window.addEventListener("chat-messenger-loaded", () => {
      chatSdk.registerContext(
        chatSdk.prebuilts.ces.createContext({
          deploymentName: "projects/project-c482c56a-16d2-4b8c-b89/locations/us/apps/0bccbf8c-d3a5-4ef7-b1df-5e8347673d4b/deployments/6a959a03-8b5b-423b-8ce3-f2eaa269d618",
          tokenBroker: { enableTokenBroker: true, enableRecaptcha: false }
        })
      );
      initAutoReading();
    });

    // 2. PDFリンクの検知（Shadow DOM貫通）
    window.addEventListener('click', (e) => {
      const path = e.composedPath();
      const a = path.find(el => el.tagName === 'A');
      if (a && a.href.includes('storage.googleapis.com')) {
        e.preventDefault();
        e.stopImmediatePropagation();
        document.getElementById('pdfFrame').src = a.href;
        document.body.classList.add('pdf-open');
      }
    }, true);

    // 3. 回答の自動読み上げ
    function initAutoReading() {
      const messenger = document.getElementById('messenger');
      setInterval(() => {
        if (!messenger.shadowRoot) return;
        const messages = messenger.shadowRoot.querySelectorAll('.message.agent, [role="listitem"]');
        const latest = messages[messages.length - 1];
        
        if (latest && !latest.dataset.read) {
          const text = latest.innerText.trim();
          // 文字が確定してから（...が消えてから）読み上げ
          if (text.length > 5 && !text.includes('...')) {
            latest.dataset.read = "true";
            const uttr = new SpeechSynthesisUtterance(text.replace(/\[\d+\]/g, ''));
            uttr.lang = 'ja-JP';
            uttr.onstart = () => { document.getElementById('speech-stop').style.display = 'block'; };
            uttr.onend = () => { document.getElementById('speech-stop').style.display = 'none'; };
            window.speechSynthesis.speak(uttr);
          }
        }
      }, 2000);
    }
  </script>
</body>
</html>
