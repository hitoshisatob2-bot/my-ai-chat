<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI 整備マニュアル検索.i</title>
    <script src="https://cloud.google.com/ai/gen-app-builder/client?hl=ja"></script>
    
    <style>
        :root { --primary-color: #1a73e8; --bg-color: #f5f7f9; }
        body { font-family: sans-serif; margin: 0; background-color: var(--bg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: var(--primary-color); color: white; padding: 15px; text-align: center; flex-shrink: 0; }
        
        /* スタート画面 */
        #start-screen { position: fixed; inset: 0; background: var(--bg-color); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .start-btn { background: var(--primary-color); color: white; border: none; padding: 15px 30px; border-radius: 30px; cursor: pointer; font-size: 18px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        /* チャットメイン画面 */
        #chat-interface { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #chat-container { flex: 1; padding: 20px; overflow-y: auto; }
        
        .welcome-msg { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid var(--primary-color); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* 入力エリア */
        .input-area { background: white; padding: 20px; border-top: 1px solid #ddd; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
        input[type="text"] { flex: 1; padding: 12px 20px; border: 1px solid #ccc; border-radius: 25px; font-size: 16px; outline: none; }
        .send-btn { background: var(--primary-color); color: white; border: none; padding: 10px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .send-btn:disabled { background: #ccc; }

        /* reCAPTCHAバッジの位置 */
        .grecaptcha-badge { bottom: 90px !important; }

        /* ウィジェットの高さ確保 */
        gen-search-widget { display: block; min-height: 500px; width: 100%; }
    </style>
</head>
<body>

<div id="start-screen">
    <h2>🔧 kubota WSM AI 整備マニュアル.i</h2>
    <button class="start-btn" onclick="startChat()">AIチャットを開始</button>
</div>

<header>
    <h1>🔧 kubota WSM AI 整備マニュアル検索</h1>
</header>

<div id="chat-interface">
    <div id="chat-container">
        <div class="welcome-msg">
            <strong>AIガイド:</strong><br>
            こんにちは！あなたをサポートするAIガイドです。質問はなんですか？
        </div>
        
        <gen-search-widget
            id="myWidget"
            configId="ea87f861-8662-4a50-b0b4-598d12387543"
            location="global"
            displayMode="inline">
        </gen-search-widget>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="質問を入力してください...">
        <button id="searchBtn" class="send-btn">検索</button>
    </div>
</div>

<script>
    const widgetEl = document.getElementById('myWidget');
    const inputEl = document.getElementById('userInput');
    const searchBtn = document.getElementById('searchBtn');
    const startScreen = document.getElementById('start-screen');

    // 「開始ボタン」でスタート画面を消すだけにする（裏でウィジェットはロード済み）
    function startChat() {
        startScreen.style.opacity = '0';
        setTimeout(() => {
            startScreen.style.display = 'none';
        }, 300);
    }

    async function performSearch() {
        const query = inputEl.value.trim();
        if (!query) return;

        searchBtn.disabled = true;
        const originalText = searchBtn.innerText;
        searchBtn.innerText = "探索中";

        // メソッドの存在チェックをより厳密に
        if (widgetEl && typeof widgetEl.search === 'function') {
            try {
                await widgetEl.search(query);
                inputEl.value = '';
                console.log("Search dispatched successfully");
            } catch (err) {
                console.error("Search error:", err);
                alert("検索中にエラーが発生しました。");
            }
        } else {
            console.warn("Widget not ready yet. Retrying in 1s...");
            setTimeout(performSearch, 1000);
            return;
        }

        searchBtn.disabled = false;
        searchBtn.innerText = originalText;
    }

    searchBtn.addEventListener('click', performSearch);
    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });
</script>

</body>
</html>
