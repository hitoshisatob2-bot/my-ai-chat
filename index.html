<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI 整備マニュアル.V</title>
    <script src="https://cloud.google.com/ai/gen-app-builder/client?hl=ja"></script>
    <style>
        /* LINE風の配色とレイアウト */
        body { 
            margin: 0; 
            background-color: #7494c0; /* LINEのトーク画面風の背景色 */
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ヘッダー */
        header { 
            background-color: #273246; 
            color: white; 
            padding: 10px; 
            text-align: center; 
            font-size: 0.9rem;
            z-index: 100;
        }

        /* トークエリア */
        .chat-container {
            flex: 1;
            padding: 20px 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* AIのメッセージ（左側） */
        .ai-msg-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .ai-icon {
            width: 40px;
            height: 40px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .ai-bubble {
            background-color: #ffffff;
            padding: 10px 15px;
            border-radius: 15px;
            position: relative;
            max-width: 70%;
            line-height: 1.5;
            font-size: 15px;
            color: #000;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        /* 吹き出しの三角（左） */
        .ai-bubble::after {
            content: "";
            position: absolute;
            top: 10px;
            left: -10px;
            border-style: solid;
            border-width: 5px 10px 5px 0;
            border-color: transparent #ffffff transparent transparent;
        }

        /* 下部入力エリア */
        .input-bar {
            background-color: #ffffff;
            padding: 10px 15px 30px;
            border-top: 1px solid #ddd;
        }

        /* 検索窓をLINEの入力欄風にする */
        #searchWidgetTrigger {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #ddd;
            background-color: #f5f5f5;
            font-size: 16px;
            box-sizing: border-box;
            cursor: pointer;
            outline: none;
        }

        /* Googleウィジェットの検索窓が浮かないように調整 */
        gen-search-widget {
            --gen-search-widget-container-max-height: 85vh;
        }
    </style>
</head>
<body>

    <header>
        kubota WSM AI 整備マニュアル.V
    </header>

    <div class="chat-container">
        <div class="ai-msg-row">
            <div class="ai-icon">🚜</div>
            <div class="bubble-container">
                <div style="font-size: 11px; color: white; margin-bottom: 4px; margin-left: 5px;">AIガイド</div>
                <div class="ai-bubble">
                    こんにちは！クボタ整備マニュアルAIガイドです。<br>
                    知りたい整備手順やトラブルについて、下の窓から入力してください。
                </div>
            </div>
        </div>
    </div>

    <div class="input-bar">
        <input type="text" id="searchWidgetTrigger" placeholder="メッセージを入力" readonly>
    </div>

    <gen-search-widget
        configId="ea87f861-8662-4a50-b0b4-598d12387543"
        triggerId="searchWidgetTrigger">
    </gen-search-widget>

</body>
</html>
