<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>kubota WSM AI - Final Fixed</title>
  <link rel="stylesheet" href="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/themes/chat-messenger-default.css">
  <link rel="stylesheet" href="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/themes/chat-messenger-layout.css">
  <script src="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/chat-messenger.js"></script>
  <style>
    :root { --panel-width: min(48vw, 900px); --divider: rgba(0,0,0,.1); }
    html, body { height: 100%; margin: 0; overflow: hidden; font-family: sans-serif; }
    .app { height: 100vh; width: 100vw; display: flex; }
    .chatArea { flex: 1; position: relative; }
    .pdfPanel { width: 0; flex: 0 0 auto; border-left: 1px solid var(--divider); transition: width 0.3s; background: #eee; }
    body.pdf-open .pdfPanel { width: var(--panel-width); }
    .pdfHeader { height: 48px; background: #fff; display: flex; align-items: center; padding: 0 15px; justify-content: space-between; border-bottom: 1px solid var(--divider); }
    iframe { width: 100%; height: calc(100% - 48px); border: none; }
    #mic-btn { position: fixed; bottom: 20px; right: 80px; z-index: 10000; width: 50px; height: 50px; border-radius: 50%; border: none; background: #1a73e8; color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #mic-btn.active { background: #d93025; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    #init-btn { position: fixed; inset: 0; background: white; z-index: 20000; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body class="">

  <div id="init-btn"><button style="padding:20px 40px; font-size:18px;" onclick="initVoice()">システムを開始する</button></div>

  <div class="app">
    <div class="chatArea">
      <chat-messenger id="messenger" allow-citations="true">
        <chat-messenger-container chat-title="kubota-wsm-ai">
          <chat-messenger-pdf-preview slot="side-panel"></chat-messenger-pdf-preview>
        </chat-messenger-container>
      </chat-messenger>
      <button id="mic-btn">🎤</button>
    </div>
    <aside class="pdfPanel">
      <div class="pdfHeader"><strong>引用資料プレビュー</strong><button onclick="document.body.classList.remove('pdf-open')">閉じる</button></div>
      <iframe id="pdfFrame"></iframe>
    </aside>
  </div>

  <script>
    const DEPLOYMENT = "projects/project-c482c56a-16d2-4b8c-b89/locations/us/apps/985287da-6040-4564-bc29-53ccd6a0b853/deployments/a5cff52b-8173-46dd-8057-7ce28af81a21";
    let canSpeak = false;

    function initVoice() {
      document.getElementById('init-btn').style.display = 'none';
      canSpeak = true;
      const u = new SpeechSynthesisUtterance("準備完了");
      u.lang = 'ja-JP';
      window.speechSynthesis.speak(u);
      monitorResponse();
    }

    // 1. PDFプレビューを右側に強制表示するロジック
    window.addEventListener('click', (e) => {
      const path = e.composedPath();
      const anchor = path.find(el => el.tagName === 'A');
      if (anchor && anchor.href.includes('storage.googleapis.com')) {
        e.preventDefault();
        e.stopImmediatePropagation();
        document.getElementById('pdfFrame').src = anchor.href;
        document.body.classList.add('pdf-open');
      }
    }, true);

    // 2. 自動読み上げロジック
    function monitorResponse() {
      const messenger = document.getElementById('messenger');
      setInterval(() => {
        if (!messenger.shadowRoot) return;
        const msgs = messenger.shadowRoot.querySelectorAll('.message.agent, [role="listitem"]');
        const last = msgs[msgs.length - 1];
        if (last && !last.dataset.read) {
          const text = last.innerText.trim();
          if (text.length > 10 && !text.includes('...')) {
            last.dataset.read = "true";
            const u = new SpeechSynthesisUtterance(text.replace(/\[\d+\]/g, ''));
            u.lang = 'ja-JP';
            window.speechSynthesis.speak(u);
          }
        }
      }, 2000);
    }

    // 3. SDK初期化
    window.addEventListener('DOMContentLoaded', () => {
      let check = setInterval(() => {
        if (window.chatSdk && document.getElementById('messenger').shadowRoot) {
          chatSdk.registerContext(chatSdk.prebuilts.ces.createContext({
            deploymentName: DEPLOYMENT,
            tokenBroker: { enableTokenBroker: true },
            pdfPreview: { enablePdfPreview: true }
          }));
          clearInterval(check);
        }
      }, 1000);
    });
  </script>
</body>
</html>
