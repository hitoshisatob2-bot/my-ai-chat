<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI Assistant.f</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; width: 100vw; font-family: sans-serif; overflow: hidden; background-color: #f4f7f9; }
        #chat-container { width: 450px; display: flex; flex-direction: column; border-right: 1px solid #d1d9e0; background: white; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; }
        #pdf-container { flex: 1; background: #525659; display: flex; flex-direction: column; position: relative; }
        #pdf-viewer { width: 100%; height: 100%; border: none; display: none; }
        #pdf-placeholder { margin: auto; color: #ffffff; text-align: center; padding: 20px; line-height: 1.6; }
        .message-bubble { background: #f0f2f5; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
        .source-tag { display: inline-block; background: #007bff; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; margin: 4px; font-size: 12px; font-weight: bold; }
        .source-tag:hover { background: #0056b3; }
        .source-tag.warning { background: #ffc107; color: #333; }
        .input-area { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        #queryInput { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        #sendBtn { padding: 10px 24px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="messages">
        <div class="message-bubble">こんにちは。クボタ整備マニュアルについて質問してください。</div>
    </div>
    <div class="input-area">
        <input type="text" id="queryInput" placeholder="質問を入力..." onkeypress="if(event.key==='Enter') askAI()">
        <button id="sendBtn" onclick="askAI()">送信</button>
    </div>
</div>

<div id="pdf-container">
    <div id="pdf-placeholder">引用元のボタンをクリックすると<br>ここにPDFが表示されます</div>
    <iframe id="pdf-viewer"></iframe>
</div>

<script>
    const API_URL = 'https://vertex-search-proxy-242714184617.asia-northeast1.run.app/query';
    const BUCKET_NAME = 'kubota-wsm-pdf-0401';

    async function askAI() {
        const input = document.getElementById('queryInput');
        const btn = document.getElementById('sendBtn');
        const query = input.value.trim();
        if (!query) return;

        input.value = '';
        input.disabled = true;
        btn.disabled = true;

        const msgDiv = document.getElementById('messages');
        const loadingId = 'loading-' + Date.now();
        msgDiv.innerHTML += `<div class="message-bubble" id="${loadingId}">検索中...</div>`;
        msgDiv.scrollTop = msgDiv.scrollHeight;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });

            const data = await response.json();
            console.log("【デバッグ】API受信データ:", data);

            let answerHtml = `<div>${data.answer.replace(/\n/g, '<br>')}</div>`;

            if (data.results && data.results.length > 0) {
                answerHtml += `<div style="margin-top:15px; border-top:1px solid #eee; padding-top:10px;"><strong>引用元:</strong><br>`;
                
                data.results.forEach((res, index) => {
                    // 1. linkプロパティを最優先で使用
                    let rawLink = res.link || "";
                    let fileName = res.title || "マニュアル";
                    const pageNum = res.pageNumber || 1;

                    let finalUrl = "";
                    let isWarning = false;

                    if (rawLink && rawLink.length > 0) {
                        // linkがある場合
                        if (rawLink.startsWith('gs://')) {
                            finalUrl = rawLink.replace('gs://', 'https://storage.googleapis.com/');
                        } else if (rawLink.startsWith('http')) {
                            finalUrl = rawLink;
                        } else {
                            finalUrl = `https://storage.googleapis.com/${BUCKET_NAME}/${encodeURIComponent(rawLink)}`;
                        }
                    } else {
                        // linkが空の場合（現在のエラー状態）
                        // やむを得ずtitleを使用するが、警告として表示
                        finalUrl = `https://storage.googleapis.com/${BUCKET_NAME}/${encodeURIComponent(fileName)}.pdf`;
                        isWarning = true;
                        console.warn(`[警告] Result ${index+1} のlinkが空です。title "${fileName}" で代用します。`);
                    }

                    const urlWithPage = `${finalUrl}#page=${pageNum}`;
                    const btnClass = isWarning ? "source-tag warning" : "source-tag";
                    
                    answerHtml += `<span class="${btnClass}" onclick="openPdf('${urlWithPage}', ${isWarning})">
                                    📄 [${index + 1}] ${fileName} P.${pageNum}
                                 </span>`;
                });
                answerHtml += `</div>`;
            }
            document.getElementById(loadingId).innerHTML = answerHtml;
        } catch (error) {
            document.getElementById(loadingId).innerHTML = "エラーが発生しました。詳細はコンソールを確認してください。";
            console.error(error);
        } finally {
            input.disabled = false;
            btn.disabled = false;
            msgDiv.scrollTop = msgDiv.scrollHeight;
        }
    }

    function openPdf(url, isWarning) {
        const viewer = document.getElementById('pdf-viewer');
        const placeholder = document.getElementById('pdf-placeholder');
        
        console.log("PDF表示試行:", url);
        
        placeholder.style.display = 'none';
        viewer.style.display = 'block';
        viewer.src = url;

        if (isWarning) {
            alert("注意: APIからファイルパス（link）が返ってきていないため、タイトル名で表示を試みています。表示されない場合はバックエンドの修正が必要です。");
        }
    }
</script>

</body>
</html>
