<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI Assistant.c</title>
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            width: 100vw;
            font-family: sans-serif;
            overflow: hidden;
            background-color: #f0f2f5;
        }

        /* 左側：チャット */
        #chat-container {
            width: 400px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
            background: white;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* 右側：PDF表示エリア */
        #pdf-container {
            flex: 1;
            background: #525659;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        #pdf-placeholder {
            margin: auto;
            color: white;
            text-align: center;
        }

        /* パーツ装飾 */
        .message-bubble {
            background: #e9ecef;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .source-tag {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            cursor: pointer;
            margin: 3px;
            font-size: 12px;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        #queryInput { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="messages">
        <div class="message-bubble">こんにちは。クボタ整備マニュアルについて質問してください。</div>
    </div>
    <div class="input-area">
        <input type="text" id="queryInput" placeholder="質問を入力..." onkeypress="if(event.key==='Enter') askAI()">
        <button id="sendBtn" onclick="askAI()">送信</button>
    </div>
</div>

<div id="pdf-container">
    <div id="pdf-placeholder">引用元のアイコンをクリックすると<br>ここにPDFが表示されます</div>
    <iframe id="pdf-viewer"></iframe>
</div>

<script>
    // Cloud RunのURLを直接指定
    const API_URL = 'https://vertex-search-proxy-242714184617.asia-northeast1.run.app/query';

    async function askAI() {
        const input = document.getElementById('queryInput');
        const btn = document.getElementById('sendBtn');
        const query = input.value.trim();
        if (!query) return;

        input.value = '';
        input.disabled = true;
        btn.disabled = true;

        const msgDiv = document.getElementById('messages');
        const loadingId = 'loading-' + Date.now();
        msgDiv.innerHTML += `<div class="message-bubble" id="${loadingId}">考え中...</div>`;
        msgDiv.scrollTop = msgDiv.scrollHeight;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });

            const data = await response.json();
            let html = `<div>${data.answer.replace(/\n/g, '<br>')}</div>`;

            if (data.results && data.results.length > 0) {
                html += `<div style="margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;"><strong>引用元:</strong><br>`;
                data.results.forEach((res, index) => {
                    // ログに基づき、深い階層にあるリンクを安全に取得
                    let rawLink = "";
                    if (res.document && res.document.derivedStructData && res.document.derivedStructData.fields && res.document.derivedStructData.fields.link) {
                        rawLink = res.document.derivedStructData.fields.link.stringValue;
                    } else {
                        rawLink = res.link || "";
                    }

                    if (rawLink) {
                        // 公開アクセス用URLに変換
                        let publicUrl = rawLink.replace('gs://', 'https://storage.googleapis.com/');
                        const finalUrl = `${encodeURI(publicUrl)}#page=${res.pageNumber || 1}`;
                        
                        html += `<span class="source-tag" onclick="openPdf('${finalUrl}')">
                                    📄 [${index + 1}] マニュアル P.${res.pageNumber || 1}
                                 </span>`;
                    }
                });
                html += `</div>`;
            }
            document.getElementById(loadingId).innerHTML = html;
        } catch (error) {
            document.getElementById(loadingId).innerHTML = "エラーが発生しました。";
            console.error(error);
        } finally {
            input.disabled = false;
            btn.disabled = false;
            msgDiv.scrollTop = msgDiv.scrollHeight;
        }
    }

    function openPdf(url) {
        const viewer = document.getElementById('pdf-viewer');
        const placeholder = document.getElementById('pdf-placeholder');
        placeholder.style.display = 'none';
        viewer.style.display = 'block';
        viewer.src = url;
    }
</script>

</body>
</html>
