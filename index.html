<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>kubota WSM AI - Fixed All Features</title>
  <link rel="stylesheet" href="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/themes/chat-messenger-default.css">
  <link rel="stylesheet" href="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/themes/chat-messenger-layout.css">
  <script src="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/chat-messenger.js"></script>
  <style>
    /* 既存のCSSスタイルを維持 */
    :root { --panel-width: min(46vw, 920px); --panel-min: 360px; --divider: rgba(0,0,0,.10); }
    html, body { height: 100%; margin: 0; overflow: hidden; background: #fff; font-family: sans-serif; }
    .app { height: 100vh; width: 100vw; display: flex; align-items: stretch; }
    .chatArea { flex: 1; position: relative; }
    .pdfPanel { width: 0; flex: 0 0 auto; border-left: 1px solid var(--divider); background: #fff; overflow: hidden; transition: all 300ms ease; }
    body.pdf-open .pdfPanel { width: max(var(--panel-min), var(--panel-width)); }
    .pdfPanelInner { height: 100%; width: 100%; display: flex; flex-direction: column; }
    .pdfHeader { height: 48px; display: flex; align-items: center; padding: 0 10px; background: #fafafa; border-bottom: 1px solid var(--divider); justify-content: space-between; }
    .pdfFrame { flex: 1; border: 0; width: 100%; height: 100%; }

    /* マイクボタン、オーバーレイ等のCSSは以前のものを継承 */
    #custom-mic-btn { position: fixed; bottom: 15px; right: 65px; z-index: 2147483647; width: 48px; height: 48px; border: none; background: #f0f0f0; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
    #custom-mic-btn.recording { background: #ff4b4b; color: white; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,75,75,0.5); } 100% { box-shadow: 0 0 0 14px rgba(255,75,75,0); } }
    #voice-overlay { display: none; position: fixed; inset: 0; z-index: 2147483646; background: rgba(0,0,0,0.55); align-items: flex-end; justify-content: center; padding-bottom: 80px; }
    #voice-overlay.active { display: flex; }
    #voice-box { background: #fff; border-radius: 18px; width: min(92vw, 480px); padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
    #speech-control { position: fixed; bottom: 70px; right: 15px; z-index: 2147483647; display: none; }
    .stop-btn { padding: 8px 16px; background: rgba(0,0,0,0.8); color: white; border-radius: 20px; border: none; font-size: 12px; cursor: pointer; }
    #init-overlay { position: fixed; inset: 0; background: #fff; z-index: 9999999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <div id="init-overlay">
    <button style="padding: 20px 40px; font-size: 20px; border-radius: 50px; cursor: pointer; background: #1a73e8; color: white; border: none;" onclick="startApp()">アプリを開始する</button>
    <p style="color: #666; margin-top: 15px;">※クリックで音声とプレビューが有効になります</p>
  </div>

  <div class="app">
    <div class="chatArea">
      <chat-messenger id="messenger" allow-citations="true" style="width:100%; height:100%;">
        <chat-messenger-container chat-title="kubota-wsm-ai">
          <chat-messenger-pdf-preview slot="side-panel"></chat-messenger-pdf-preview>
        </chat-messenger-container>
      </chat-messenger>
      <button id="custom-mic-btn" title="音声入力">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
      <div id="speech-control"><button class="stop-btn" onclick="stopSpeaking()">読み上げ停止 ■</button></div>
    </div>
    <aside class="pdfPanel">
      <div class="pdfPanelInner">
        <div class="pdfHeader">
          <div id="pdfTitle" style="font-size:12px; font-weight: bold;">引用プレビュー</div>
          <button onclick="closePdfPanel()">閉じる</button>
        </div>
        <iframe id="pdfFrame" class="pdfFrame"></iframe>
      </div>
    </aside>
  </div>

  <div id="voice-overlay"><div id="voice-box"><div id="voice-text" style="font-size:18px; min-height:60px; margin-bottom:15px;">聞り上げ中...</div></div></div>

  <script>
    const DEPLOYMENT = "projects/project-c482c56a-16d2-4b8c-b89/locations/us/apps/985287da-6040-4564-bc29-53ccd6a0b853/deployments/a5cff52b-8173-46dd-8057-7ce28af81a21";
    let voiceEnabled = false;

    function startApp() {
      document.getElementById('init-overlay').style.display = 'none';
      voiceEnabled = true;
      const u = new SpeechSynthesisUtterance("準備ができました");
      u.lang = 'ja-JP';
      window.speechSynthesis.speak(u);
      startResponseMonitoring();
    }

    /* ── PDFプレビュー制御：Shadow DOM貫通版 ── */
    function openPdfInRightPanel(url) {
      const frame = document.getElementById("pdfFrame");
      frame.src = url;
      document.body.classList.add("pdf-open");
    }
    function closePdfPanel() {
      document.body.classList.remove("pdf-open");
      document.getElementById("pdfFrame").src = "";
    }

    // Shadow DOM内のリンククリックを検知する
    window.addEventListener("click", (e) => {
      const path = e.composedPath(); // Shadow DOMを突き抜けて要素を取得
      const a = path.find(el => el.tagName === "A");
      if (a && (a.href.includes(".pdf") || a.href.includes("storage.googleapis.com"))) {
        e.preventDefault();
        e.stopImmediatePropagation(); // Google SDKのデフォルト動作を阻止
        openPdfInRightPanel(a.href);
      }
    }, true); // Captureフェーズで実行

    /* ── 自動読み上げロジック ── */
    function speak(text) {
      if (!voiceEnabled || !text) return;
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/\[\d+\]/g, '').replace(/[*#_]/g, '').replace(/\n/g, '。').trim();
      const uttr = new SpeechSynthesisUtterance(cleanText);
      uttr.lang = 'ja-JP';
      uttr.onstart = () => document.getElementById('speech-control').style.display = 'block';
      uttr.onend = () => document.getElementById('speech-control').style.display = 'none';
      window.speechSynthesis.speak(uttr);
    }

    function stopSpeaking() { window.speechSynthesis.cancel(); document.getElementById('speech-control').style.display = 'none'; }

    function startResponseMonitoring() {
      const messenger = document.getElementById('messenger');
      let ttsTimer = null;
      setInterval(() => {
        if (!messenger.shadowRoot) return;
        const messages = Array.from(messenger.shadowRoot.querySelectorAll('.message.agent, [role="listitem"]'));
        const latest = messages[messages.length - 1];
        if (latest && !latest.dataset.spoken) {
          const text = latest.innerText.trim();
          if (text.length > 5 && !text.includes('...') && !text.endsWith('…')) {
            clearTimeout(ttsTimer);
            ttsTimer = setTimeout(() => {
              if (latest.innerText.trim() === text) {
                latest.dataset.spoken = "true";
                speak(text);
              }
            }, 1500);
          }
        }
      }, 1000);
    }

    /* ── SDK初期化 ── */
    window.addEventListener("DOMContentLoaded", () => {
      const t = setInterval(() => {
        if (window.chatSdk && document.getElementById('messenger').shadowRoot) {
          chatSdk.registerContext(chatSdk.prebuilts.ces.createContext({
            deploymentName: DEPLOYMENT,
            tokenBroker: { enableTokenBroker: true },
            pdfPreview: { enablePdfPreview: true }
          }));
          clearInterval(t);
        }
      }, 500);
    });

    // 音声入力(Speech Recognition)のロジックは以前のものをそのまま統合してください
  </script>
</body>
</html>
