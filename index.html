<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI ガイド.c</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; background-color: #f0f2f5; overflow: hidden; }
        
        /* チャットエリア */
        #main-content { flex: 1; display: flex; flex-direction: column; transition: 0.3s; border-right: 1px solid #ddd; }
        header { background: #273246; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background-color: #7494c0; }

        /* 吹き出しデザイン（以前の形式を意識） */
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; line-height: 1.6; font-size: 14px; position: relative; }
        .ai-container { display: flex; flex-direction: column; align-items: flex-start; }
        .ai-bubble { background: white; color: #333; border-top-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .user-bubble { background: #85e249; align-self: flex-end; border-top-right-radius: 2px; }

        /* 目玉アイコンボタン */
        .view-icon {
            cursor: pointer; background: none; border: none; font-size: 18px;
            margin-top: 5px; opacity: 0.7; transition: 0.2s;
        }
        .view-icon:hover { opacity: 1; transform: scale(1.1); }

        /* スライドパネル（PDF表示用） */
        #side-panel { width: 0; transition: 0.3s; background: #555; position: relative; display: flex; flex-direction: column; }
        #side-panel.open { width: 45%; } /* 画面の45%を占有 */
        iframe { width: 100%; height: 100%; border: none; background: white; }
        .close-btn { position: absolute; left: -40px; top: 10px; width: 40px; height: 40px; background: #273246; color: white; border: none; cursor: pointer; border-radius: 5px 0 0 5px; }

        /* 入力エリア */
        .input-bar { background: white; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        #user-input { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 25px; outline: none; }
        #send-btn { background: #1a73e8; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<div id="main-content">
    <header>kubota WSM AI ガイド.c</header>
    <div id="chat-history"></div>
    <div class="input-bar">
        <input type="text" id="user-input" placeholder="メッセージを入力">
        <button id="send-btn" onclick="handleSend()">▲</button>
    </div>
</div>

<div id="side-panel">
    <button class="close-btn" onclick="togglePanel(false)">✕</button>
    <iframe id="pdf-viewer"></iframe>
</div>

<script>
    const CLOUD_RUN_URL = "https://vertex-search-proxy-242714184617.asia-northeast1.run.app/query";

    function appendMessage(text, isUser, pdfUrl = null) {
        const history = document.getElementById('chat-history');
        const container = document.createElement('div');
        container.className = isUser ? "msg user-bubble" : "ai-container";

        if (isUser) {
            container.innerText = text;
        } else {
            const bubble = document.createElement('div');
            bubble.className = "msg ai-bubble";
            // HTMLタグ（太字や改行）を反映させる
            bubble.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            container.appendChild(bubble);

            if (pdfUrl) {
                const btn = document.createElement('button');
                btn.className = "view-icon";
                btn.innerHTML = "👁️ 根拠を確認";
                btn.onclick = () => {
                    document.getElementById('pdf-viewer').src = pdfUrl;
                    togglePanel(true);
                };
                container.appendChild(btn);
            }
        }
        history.appendChild(container);
        history.scrollTop = history.scrollHeight;
    }

    async function handleSend() {
        const input = document.getElementById('user-input');
        const query = input.value.trim();
        if (!query) return;

        appendMessage(query, true);
        input.value = "";

        // プロンプトエンジニアリング：以前の回答形式を強制
        const enrichedPrompt = `クボタの専門整備士として、以下の質問に答えてください。
複数の機種に関する情報がある場合は、必ず機種名ごとにセクションを分けて（例：**SL280の場合**）、ステップ形式で手順を説明してください。
質問：${query}`;

        try {
            const res = await fetch(CLOUD_RUN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: enrichedPrompt })
            });
            const data = await res.json();

            let answer = data.summary?.summaryText || "回答が見つかりませんでした。";
            let pdfUrl = null;

            if (data.results?.length > 0) {
                let link = data.results[0].document.derivedStructData.link || data.results[0].document.derivedStructData.formattedUrl;
                if (link && link.startsWith('gs://')) {
                    pdfUrl = link.replace('gs://', 'https://storage.googleapis.com/');
                } else {
                    pdfUrl = link;
                }
            }
            appendMessage(answer, false, pdfUrl);
        } catch (e) {
            appendMessage("エラーが発生しました。", false);
        }
    }

    function togglePanel(open) {
        document.getElementById('side-panel').className = open ? "open" : "";
    }

    document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
</script>
</body>
</html>
