<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI Assistant.a</title>
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            width: 100vw;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            background-color: #f4f7f9;
        }

        /* 左側：チャットエリア */
        #chat-container {
            width: 450px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #d1d9e0;
            background: white;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* 右側：PDF表示エリア */
        #pdf-container {
            flex: 1;
            background: #525659;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* 初期状態は非表示 */
        }

        #pdf-placeholder {
            margin: auto;
            color: #ffffff;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* メッセージバブル */
        .message-bubble {
            background: #f0f2f5;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        /* 引用元ボタン（青色） */
        .source-tag {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            margin: 4px;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .source-tag:hover {
            background: #0056b3;
        }

        /* エラー用ボタン（赤色） */
        .source-tag.error {
            background: #dc3545;
            cursor: not-allowed;
        }

        /* 入力エリア */
        .input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            background: #fff;
        }

        #queryInput { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 8px;
            outline: none;
        }

        #sendBtn { 
            padding: 10px 24px; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer;
            font-weight: bold;
        }
        
        #sendBtn:disabled { background: #ccc; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="messages">
        <div class="message-bubble">こんにちは。クボタ整備マニュアルについて質問してください。</div>
    </div>
    <div class="input-area">
        <input type="text" id="queryInput" placeholder="例：エンジンの分解手順は？" onkeypress="if(event.key==='Enter') askAI()">
        <button id="sendBtn" onclick="askAI()">送信</button>
    </div>
</div>

<div id="pdf-container">
    <div id="pdf-placeholder">
        引用元のボタンをクリックすると<br>ここにPDFマニュアルが表示されます
    </div>
    <iframe id="pdf-viewer"></iframe>
</div>

<script>
    // Cloud RunのAPIエンドポイント
    const API_URL = 'https://vertex-search-proxy-242714184617.asia-northeast1.run.app/query';

    async function askAI() {
        const input = document.getElementById('queryInput');
        const btn = document.getElementById('sendBtn');
        const query = input.value.trim();
        if (!query) return;

        // 入力をロック
        input.value = '';
        input.disabled = true;
        btn.disabled = true;

        const msgDiv = document.getElementById('messages');
        const loadingId = 'loading-' + Date.now();
        msgDiv.innerHTML += `<div class="message-bubble" id="${loadingId}">検索中...</div>`;
        msgDiv.scrollTop = msgDiv.scrollHeight;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });

            if (!response.ok) throw new Error('Network response was not ok');

            const data = await response.json();
            let answerHtml = `<div>${data.answer.replace(/\n/g, '<br>')}</div>`;

            // 検索結果（引用元）がある場合の処理
            if (data.results && data.results.length > 0) {
                answerHtml += `<div style="margin-top:15px; border-top:1px solid #eee; padding-top:10px;"><strong>引用元:</strong><br>`;
                
                data.results.forEach((res, index) => {
                    // あらゆるパターンのデータ構造からリンクを探す（強化版）
                    let gcsPath = res.document?.uri || 
                                  res.document?.derivedStructData?.link || 
                                  res.document?.derivedStructData?.fields?.link?.stringValue || 
                                  res.link || 
                                  "";

                    console.log(`[デバッグ] 取得したリンク情報 ${index + 1}:`, gcsPath);

                    const pageNum = res.pageNumber || 1;

                    if (gcsPath) {
                        let publicUrl = gcsPath;
                        // gs:// から始まる場合は https:// に変換
                        if (gcsPath.startsWith('gs://')) {
                            publicUrl = gcsPath.replace('gs://', 'https://storage.googleapis.com/');
                        }
                        
                        const finalUrl = `${encodeURI(publicUrl)}#page=${pageNum}`;
                        
                        // 正常な青いボタン
                        answerHtml += `<span class="source-tag" onclick="openPdf('${finalUrl}')">
                                        📄 [${index + 1}] マニュアル P.${pageNum}
                                     </span>`;
                    } else {
                        // パスが見つからなかった場合は赤いボタンを表示して原因を可視化
                        answerHtml += `<span class="source-tag error" title="URLデータが含まれていません">
                                        ⚠️ [${index + 1}] リンク取得失敗
                                     </span>`;
                    }
                });
                answerHtml += `</div>`;
            }
            
            document.getElementById(loadingId).innerHTML = answerHtml;

        } catch (error) {
            document.getElementById(loadingId).innerHTML = "エラーが発生しました。接続を確認してください。";
            console.error('Error:', error);
        } finally {
            input.disabled = false;
            btn.disabled = false;
            msgDiv.scrollTop = msgDiv.scrollHeight;
        }
    }

    // PDFを右側のiframeに表示する関数
    function openPdf(url) {
        const viewer = document.getElementById('pdf-viewer');
        const placeholder = document.getElementById('pdf-placeholder');
        
        placeholder.style.display = 'none';
        viewer.style.display = 'block';
        viewer.src = url;
    }
</script>

</body>
</html>
