<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI 整備マニュアル.W</title>
    <style>
        /* --- デザイン：LINE風トーク画面 --- */
        body { 
            margin: 0; background-color: #7494c0; 
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
            display: flex; flex-direction: column; height: 100vh;
        }
        header { 
            background-color: #273246; color: white; padding: 12px; 
            text-align: center; font-weight: bold; font-size: 16px;
        }
        /* トーク履歴エリア */
        #chat-history {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 15px;
        }
        /* 共通の吹き出しスタイル */
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 15px; line-height: 1.5; position: relative; }
        
        /* AIのメッセージ（左側） */
        .ai-msg-container { display: flex; align-items: flex-start; gap: 8px; }
        .ai-icon { width: 35px; height: 35px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .ai-bubble { background-color: white; color: black; align-self: flex-start; border-top-left-radius: 2px; }

        /* 自分のメッセージ（右側） */
        .user-bubble { background-color: #85e249; color: black; align-self: flex-end; border-top-right-radius: 2px; }

        /* 下部入力バー */
        .input-bar { background: white; padding: 10px; display: flex; gap: 8px; align-items: center; }
        #user-input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 15px; font-size: 16px; outline: none; }
        #send-btn { background: #1a73e8; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px; }
        
        /* ローディングアニメーション */
        .loading { color: white; font-size: 12px; margin-left: 45px; display: none; padding: 5px; }
    </style>
</head>
<body>

    <header>kubota WSM AI ガイド.W</header>

    <div id="chat-history">
        <div class="ai-msg-container">
            <div class="ai-icon">🚜</div>
            <div class="msg ai-bubble">こんにちは！クボタ整備マニュアルAIです。知りたい手順をステップ形式でお教えします。何を確認しますか？</div>
        </div>
    </div>

    <div id="loading" class="loading">AIが考え中...</div>

    <div class="input-bar">
        <input type="text" id="user-input" placeholder="メッセージを入力">
        <button id="send-btn" onclick="handleSend()">▲</button>
    </div>

    <script>
        // --- 設定：Cloud RunのURL ---
        const CLOUD_RUN_URL = "https://vertex-search-proxy-242714184617.asia-northeast1.run.app/query"; 

        const historyContainer = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const loading = document.getElementById('loading');

        // メッセージを画面に追加する関数
        function appendMessage(text, isUser) {
            if (isUser) {
                const div = document.createElement('div');
                div.className = "msg user-bubble";
                div.innerText = text;
                historyContainer.appendChild(div);
            } else {
                const container = document.createElement('div');
                container.className = "ai-msg-container";
                // 改行を<br>に変換して表示
                const formattedText = text.replace(/\n/g, '<br>');
                container.innerHTML = `<div class="ai-icon">🚜</div><div class="msg ai-bubble">${formattedText}</div>`;
                historyContainer.appendChild(container);
            }
            // 一番下までスクロール
            historyContainer.scrollTop = historyContainer.scrollHeight;
        }

        // 送信ボタンが押された時の処理
        async function handleSend() {
            const question = userInput.value.trim();
            if (!question) return;

            // 1. ユーザーの質問を画面に出す
            appendMessage(question, true);
            userInput.value = "";
            loading.style.display = "block";

            // 2. AIに回答をリクエストする
            try {
                // 回答の質を高める指示を追加
                const promptWithInstruction = question + "（1. 2. 3. と番号を振って、具体的な整備手順をステップ形式で詳しく回答してください）";

                const response = await fetch(CLOUD_RUN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: promptWithInstruction })
                });

                if (!response.ok) {
                    throw new Error('サーバーエラーが発生しました');
                }

                const data = await response.json();
                console.log("受信データ:", data); // デバッグ用

                // 3. AIの回答を解析して画面に出す
                // Vertex AI Searchの回答は data.summary.summaryText に格納されています
                let aiAnswer = "";
                
                if (data.summary && data.summary.summaryText) {
                    aiAnswer = data.summary.summaryText;
                } else if (data.results && data.results.length > 0) {
                    // summaryがない場合、検索結果の断片を表示する（予備の処理）
                    aiAnswer = "関連する情報が見つかりました：\n" + data.results[0].document.derivedStructData.snippets[0].snippet;
                } else {
                    aiAnswer = "申し訳ありません。マニュアルから該当する回答を見つけることができませんでした。";
                }

                appendMessage(aiAnswer, false);

            } catch (error) {
                console.error("Error:", error);
                appendMessage("エラーが発生しました。接続を確認してください。", false);
            } finally {
                loading.style.display = "none";
            }
        }

        // Enterキーでも送信できるようにする
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
