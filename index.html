<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI ガイド.d</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; background-color: #7494c0; overflow: hidden; }
        #main-content { flex: 1; display: flex; flex-direction: column; transition: 0.3s; }
        header { background: #273246; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; line-height: 1.6; font-size: 14px; }
        .ai-container { display: flex; flex-direction: column; align-items: flex-start; }
        .ai-bubble { background: white; color: #333; border-top-left-radius: 2px; }
        .user-bubble { background: #85e249; align-self: flex-end; border-top-right-radius: 2px; }
        .view-icon {
            cursor: pointer; background: white; border: 1px solid #1a73e8; color: #1a73e8;
            padding: 5px 12px; border-radius: 20px; font-size: 12px; margin-top: 8px;
            display: flex; align-items: center; gap: 5px;
        }
        #side-panel { width: 0; transition: 0.3s; background: #333; position: relative; }
        #side-panel.open { width: 50%; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        .close-btn { position: absolute; left: -40px; top: 10px; width: 40px; height: 40px; background: #273246; color: white; border: none; cursor: pointer; }
        .input-bar { background: white; padding: 15px; display: flex; gap: 10px; }
        #user-input { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 25px; outline: none; }
        #send-btn { background: #1a73e8; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
        .loading { color: white; font-size: 12px; text-align: center; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="main-content">
    <header>kubota WSM AI ガイド.d</header>
    <div id="chat-history"></div>
    <div id="loading" class="loading">マニュアルを解析中...</div>
    <div class="input-bar">
        <input type="text" id="user-input" placeholder="メッセージを入力">
        <button id="send-btn" onclick="handleSend()">▲</button>
    </div>
</div>

<div id="side-panel">
    <button class="close-btn" onclick="togglePanel(false)">✕</button>
    <iframe id="pdf-viewer"></iframe>
</div>

<script>
    const CLOUD_RUN_URL = "https://vertex-search-proxy-242714184617.asia-northeast1.run.app/query";

    function appendMessage(text, isUser, pdfUrl = null) {
        const history = document.getElementById('chat-history');
        const container = document.createElement('div');
        container.className = isUser ? "msg user-bubble" : "ai-container";

        if (isUser) {
            container.innerText = text;
        } else {
            const bubble = document.createElement('div');
            bubble.className = "msg ai-bubble";
            bubble.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            container.appendChild(bubble);

            if (pdfUrl) {
                const btn = document.createElement('button');
                btn.className = "view-icon";
                btn.innerHTML = "👁️ 該当ページを表示";
                btn.onclick = () => {
                    document.getElementById('pdf-viewer').src = pdfUrl;
                    togglePanel(true);
                };
                container.appendChild(btn);
            }
        }
        history.appendChild(container);
        history.scrollTop = history.scrollHeight;
    }

    async function handleSend() {
        const input = document.getElementById('user-input');
        const query = input.value.trim();
        if (!query) return;

        appendMessage(query, true);
        input.value = "";
        document.getElementById('loading').style.display = "block";

        try {
            const res = await fetch(CLOUD_RUN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });
            const data = await res.json();

            let answer = data.summary?.summaryText || "回答が見つかりませんでした。";
            let finalPdfUrl = null;

            if (data.results && data.results.length > 0) {
                const result = data.results[0];
                let link = result.document.derivedStructData.link || result.document.derivedStructData.formattedUrl;
                
                // gs:// を HTTPS に変換
                if (link && link.startsWith('gs://')) {
                    link = link.replace('gs://', 'https://storage.googleapis.com/');
                }

                // ページ番号の取得を試みる
                let pageNumber = 1;
                const structData = result.document.derivedStructData;
                if (structData.extractive_segments && structData.extractive_segments[0].pageNumber) {
                    pageNumber = structData.extractive_segments[0].pageNumber;
                } else if (structData.pages && structData.pages[0]) {
                    pageNumber = structData.pages[0];
                }

                // URLにページ指定 (#page=X) を追加
                finalPdfUrl = link + "#page=" + pageNumber;
            }

            appendMessage(answer, false, finalPdfUrl);
        } catch (e) {
            appendMessage("通信エラーが発生しました。", false);
        } finally {
            document.getElementById('loading').style.display = "none";
        }
    }

    function togglePanel(open) {
        document.getElementById('side-panel').className = open ? "open" : "";
    }
    document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
</script>
</body>
</html>
