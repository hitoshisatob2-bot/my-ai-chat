<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kubota WSM AI ガイド.b</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: "Hiragino Kaku Gothic ProN", Arial, sans-serif; overflow: hidden; background-color: #f0f2f5; }
        
        /* --- 左側：LINE風チャットエリア --- */
        #chat-container { width: 50%; display: flex; flex-direction: column; background-color: #7494c0; border-right: 2px solid #ccc; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 10; }
        header { background: #273246; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; line-height: 1.6; font-size: 14px; position: relative; }
        .ai-container { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
        .ai-bubble { background: white; color: #333; border-top-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .user-bubble { background: #85e249; color: #111; align-self: flex-end; border-top-right-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        /* アイコンボタン（PDF表示用） */
        .pdf-icon-btn { 
            background: #ffffff; border: 1px solid #1a73e8; color: #1a73e8; 
            padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; 
            display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .pdf-icon-btn:hover { background: #1a73e8; color: white; }

        /* 入力エリア */
        .input-bar { background: white; padding: 15px; display: flex; gap: 10px; align-items: center; }
        #user-input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 14px; }
        #send-btn { background: #1a73e8; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; justify-content: center; align-items: center; }
        .loading { color: white; font-size: 12px; margin-left: 10px; display: none; padding-bottom: 10px; text-align: center; }

        /* --- 右側：PDF表示エリア --- */
        #pdf-container { width: 50%; background: #525659; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        iframe { width: 100%; height: 100%; border: none; background: white; display: none; }
        #pdf-placeholder { text-align: center; opacity: 0.7; }
    </style>
</head>
<body>

<div id="chat-container">
    <header>kubota WSM AI ガイド.b</header>
    <div id="chat-history">
        <div class="ai-container">
            <div class="msg ai-bubble">こんにちは！調べたい手順や機種名を入力してください。<br>公式ウィジェットと同等の精度でマニュアルから回答します。</div>
        </div>
    </div>
    <div id="loading" class="loading">マニュアルを解析中...</div>
    <div class="input-bar">
        <input type="text" id="user-input" placeholder="例：ボンネットの開け方は？">
        <button id="send-btn" onclick="handleSend()">▲</button>
    </div>
</div>

<div id="pdf-container">
    <div id="pdf-placeholder">
        <p>ここにPDFマニュアルが表示されます</p>
    </div>
    <iframe id="pdf-viewer" src=""></iframe>
</div>

<script>
    const CLOUD_RUN_URL = "https://vertex-search-proxy-242714184617.asia-northeast1.run.app/query";

    function appendMessage(text, isUser, pdfInfo = null) {
        const history = document.getElementById('chat-history');
        const container = document.createElement('div');
        container.className = isUser ? "msg user-bubble" : "ai-container";

        if (isUser) {
            container.innerText = text;
        } else {
            const bubble = document.createElement('div');
            bubble.className = "msg ai-bubble";
            
            // テキストの整形（改行、太字、引用記号 [1] を見やすく）
            let formattedText = text
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\[(\d+)\]/g, '<span style="color:#1a73e8; font-weight:bold;">[$1]</span>');
            
            bubble.innerHTML = formattedText;
            container.appendChild(bubble);

            // PDFを開くためのアイコンボタンを生成
            if (pdfInfo) {
                const btn = document.createElement('button');
                btn.className = "pdf-icon-btn";
                btn.innerHTML = `📄 根拠ページ（P.${pdfInfo.page}）を開く`;
                btn.onclick = () => {
                    document.getElementById('pdf-placeholder').style.display = 'none';
                    const iframe = document.getElementById('pdf-viewer');
                    iframe.style.display = 'block';
                    iframe.src = pdfInfo.url;
                };
                container.appendChild(btn);
            }
        }
        history.appendChild(container);
        history.scrollTop = history.scrollHeight;
    }

    async function handleSend() {
        const input = document.getElementById('user-input');
        const query = input.value.trim();
        if (!query) return;

        appendMessage(query, true);
        input.value = "";
        document.getElementById('loading').style.display = "block";

        try {
            const res = await fetch(CLOUD_RUN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });
            const data = await res.json();

            let answer = data.summary?.summaryText || "該当する情報が見つかりませんでした。";
            let pdfInfo = null;

            if (data.results && data.results.length > 0) {
                const doc = data.results[0].document.derivedStructData;
                let rawLink = doc.link || doc.formattedUrl;
                
                if (rawLink && rawLink.startsWith('gs://')) {
                    rawLink = rawLink.replace('gs://', 'https://storage.googleapis.com/');
                }

                let pageNum = 1;
                if (doc.extractive_segments && doc.extractive_segments.length > 0) {
                    pageNum = doc.extractive_segments[0].pageNumber || 1;
                }
                
                if (rawLink) {
                    pdfInfo = {
                        url: `${rawLink}#page=${pageNum}`,
                        page: pageNum
                    };
                }
            }

            appendMessage(answer, false, pdfInfo);

        } catch (e) {
            appendMessage("通信エラーが発生しました。", false);
        } finally {
            document.getElementById('loading').style.display = "none";
        }
    }

    document.getElementById('user-input').addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') handleSend(); 
    });
</script>
</body>
</html>
