<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>kubota WSM AI - API Key Mode</title>
  <link rel="stylesheet" href="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/themes/chat-messenger-default.css">
  <script src="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/chat-messenger.js"></script>
  <style>
    body { margin: 0; height: 100vh; }
    #start-btn { position: fixed; inset: 0; background: white; z-index: 999; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="start-btn"><button style="padding:20px;" onclick="start()">AIを起動する</button></div>

  <chat-messenger id="messenger" url-allowlist="*">
    <chat-messenger-container chat-title="kubota WSM AI"></chat-messenger-container>
  </chat-messenger>

  <script>
    function start() {
      document.getElementById('start-btn').style.display = 'none';
      chatSdk.registerContext(chatSdk.prebuilts.ces.createContext({
        deploymentName: "projects/project-c482c56a-16d2-4b8c-b89/locations/us/apps/0bccbf8c-d3a5-4ef7-b1df-5e8347673d4b/deployments/6a959a03-8b5b-423b-8ce3-f2eaa269d618",
        // ★ここに作成したAPIキーを貼り付けてください
        apiKey: "AIzaSyC01Bcy4PWCQ954qbs9KELdcwZkOsr1-TU", 
        tokenBroker: { enableTokenBroker: false } // allUsersを使わないのでfalse
      }));
    }
  </script>
</body>
</html>
