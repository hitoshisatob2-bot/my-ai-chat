<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>kubota WSM AI</title>

  <link rel="stylesheet" href="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/themes/chat-messenger-default.css">
  <script src="https://www.gstatic.com/ces-console/fast/chat-messenger/prod/v1.12/chat-messenger.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; display: flex; height: 100vh; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; background: #f0f4f8; }
    .chat-container { flex: 1; position: relative; display: flex; flex-direction: column; background: #fff; min-width: 0; }
    .chat-header { display:flex; align-items:center; gap:12px; padding:14px 20px; background:#1a73e8; color:#fff; font-size:1rem; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,0.15); z-index:10; flex-shrink:0; }
    chat-messenger { flex: 1; display:flex; flex-direction:column; overflow:hidden; }
    .pdf-panel { width:0; border-left:2px solid #ddd; transition: width 0.4s ease-in-out; background:#525659; overflow:hidden; flex-shrink:0; position:relative; }
    body.pdf-open .pdf-panel { width: 50vw; }
    .pdf-close-btn { position:absolute; top:8px; right:8px; z-index:20; background:rgba(0,0,0,0.3); border:none; color:#fff; width:32px; height:32px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .pdf-panel iframe { width:100%; height:100%; border:none; }
    #start-screen { position:fixed; inset:0; background: linear-gradient(135deg, #e8f0fe 0%, #f8f9ff 100%); z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
    .start-btn { margin-top:16px; padding:18px 52px; font-size:1.1rem; font-weight:600; background:#1a73e8; color:#fff; border:none; border-radius:50px; cursor:pointer; box-shadow: 0 4px 12px rgba(26,115,232,0.4); }
  </style>
</head>

<body>
  <div id="start-screen">
    <div style="font-size:2.4rem;font-weight:800;color:#1a73e8;margin-bottom:8px;">kubota WSM AI</div>
    <div style="color:#444;font-size:1.1rem;">整備マニュアル AIアシスタント</div>
    <button class="start-btn" onclick="startApp()">AIアシスタントを起動する</button>
    <div style="font-size:0.85rem;color:#888;margin-top:10px;">PDFドキュメントから回答を探します</div>
  </div>

  <div class="chat-container">
    <div class="chat-header">kubota WSM AI　整備マニュアル検索</div>

    <chat-messenger id="messenger" url-allowlist="*">
      <chat-messenger-container chat-title="kubota WSM AI" enable-audio-input="true">
      </chat-messenger-container>
    </chat-messenger>
  </div>

  <aside class="pdf-panel">
    <button class="pdf-close-btn" onclick="closePdf()" title="閉じる">✕</button>
    <iframe id="pdfFrame" title="Document Viewer"></iframe>
  </aside>

  <script>
    // プロジェクトIDとデプロイ情報の最終確認済み
    // 「us」を「global」に書き換えます
    const MY_DEPLOYMENT = "projects/project-c482c56a-16d2-4b8c-b89/locations/global/apps/0bccbf8c-d3a5-4ef7-b1df-5e8347673d4b/deployments/6a959a03-8b5b-423b-8ce3-f2eaa269d618";
    const MY_API_KEY = "AIzaSyC01Bcy4PWCQ954qbs9KELdcwZkOsr1-TU"; 

    function startApp() {
      console.log("DEBUG: Start button clicked."); // 動作確認用
      document.getElementById('start-screen').style.display = 'none';

      try {
        // SDKの初期化
        const context = chatSdk.prebuilts.ces.createContext({
          deploymentName: MY_DEPLOYMENT,
          apiKey: MY_API_KEY,
          tokenBroker: { enableTokenBroker: false }
        });

        chatSdk.registerContext(context);
        console.log("DEBUG: Chat SDK initialized with API Key ✅");
      } catch (e) {
        console.error("DEBUG: Initialization failed", e);
      }
    }

    // PDFリンク検知
    window.addEventListener('click', (e) => {
      const path = e.composedPath();
      const a = path.find(el => el && el.tagName === 'A');
      if (a && a.href && (a.href.includes('storage.googleapis.com') || a.href.toLowerCase().endsWith('.pdf'))) {
        e.preventDefault();
        e.stopImmediatePropagation();
        document.getElementById('pdfFrame').src = a.href;
        document.body.classList.add('pdf-open');
        console.log("DEBUG: PDF Link detected:", a.href);
      }
    }, true);

    function closePdf() {
      document.body.classList.remove('pdf-open');
    }
  </script>
</body>
</html>
